[package]
name = "solphia-pad"
version = "0.1.0"
edition = "2021"
description = "Solphia in-house Pump-style bonding curve. 1% fee, no Pump.fun."

[lib]
crate-type = ["cdylib", "lib"]
name = "solphia_pad"

[dependencies]
solana-program = "1.18.26"
spl-token = { version = "4.0.3", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "3.0.4", features = ["no-entrypoint"] }

[features]
no-entrypoint = []
